<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaksi — Tryout UPKP</title>
  <link rel="icon" type="image/png" sizes="48x48" href="/img/favicon-48.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <div class="admin-layout">
    <aside id="admin-side"></aside>
    <main class="admin-main">
      <div class="admin-head"><h1>Transaksi Pembayaran</h1></div>
      <div class="card" style="padding:14px 16px;margin-bottom:14px">
        <div class="filter-bar" style="margin:0">
          <strong style="white-space:nowrap">Mode Pembayaran:</strong>
          <select id="pay-mode" aria-label="Mode pembayaran">
            <option value="gateway">Gateway otomatis (QRIS dinamis)</option>
            <option value="hybrid">Gateway + tombol Bayar Manual</option>
            <option value="manual">Manual saja (dipaksa)</option>
          </select>
          <button class="btn" id="mode-save" type="button">Simpan Mode</button>
          <span class="small muted">Berlaku untuk transaksi baru langsung; halaman bayar mengikuti maks. 1 menit.</span>
        </div>
        <div id="mode-desc" class="small muted" style="margin-top:8px"></div>
      </div>
      <div class="card" style="padding:14px 16px;margin-bottom:14px">
        <div class="filter-bar" style="margin:0">
          <strong style="white-space:nowrap">Gateway Aktif:</strong>
          <select id="active-gw" aria-label="Gateway pembayaran aktif">
            <option value="pakasir">Pakasir</option>
            <option value="duitku">Duitku</option>
          </select>
          <button class="btn" id="gw-save" type="button">Simpan Gateway</button>
          <span class="small muted">Gateway utama transaksi QRIS baru; bila error saat create, otomatis dialihkan ke gateway satunya.</span>
        </div>
        <div id="gw-desc" class="small muted" style="margin-top:8px"></div>
      </div>
      <div class="filter-bar">
        <select id="f-status">
          <option value="">Semua Status</option>
          <option value="pending">Pending</option>
          <option value="paid">Paid</option>
          <option value="failed">Failed</option>
          <option value="expired">Expired</option>
        </select>
        <button class="btn btn-ghost" id="p-today" type="button">Hari Ini</button>
        <button class="btn btn-ghost" id="p-yesterday" type="button">Kemarin</button>
        <input type="date" id="f-from" aria-label="Dari tanggal">
        <span class="muted">–</span>
        <input type="date" id="f-to" aria-label="Sampai tanggal">
        <button class="btn" id="filter-btn">Filter</button>
        <button class="btn btn-ghost" id="p-all" type="button">Semua Tanggal</button>
      </div>
      <div class="card">
        <div id="revenue" class="rev-bar muted">Memuat…</div>
        <div id="list"><p class="muted">Memuat…</p></div>
        <div class="pager" id="pager"></div>
      </div>
    </main>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    (async function () {
      const me = await ADM.adminInit('/admin/payments.html');
      if (!me) return;

      // ----- Mode pembayaran (toggle runtime, tanpa deploy) -----
      const modeSel = document.getElementById('pay-mode');
      const modeDesc = document.getElementById('mode-desc');
      const modeSave = document.getElementById('mode-save');
      const MODE_DESC = {
        gateway: 'Gateway otomatis: user hanya membayar via QRIS dinamis (Pakasir/Duitku sesuai Gateway Aktif) — akses aktif otomatis setelah bayar. Mode normal produksi.',
        hybrid: 'Gateway + alternatif: QRIS dinamis tetap utama, tombol "Bayar Manual" juga tampil di tiap paket.',
        manual: 'Semua transaksi dipaksa alur manual (QRIS statis + konfirmasi WA, verifikasi admin) dan banner gangguan tampil di halaman bayar. Pakai saat kedua gateway bermasalah.',
      };
      async function loadMode() {
        try {
          const d = await TO.api('/api/admin/settings/payment-mode');
          modeSel.value = d.mode;
          modeDesc.textContent = MODE_DESC[d.mode] || '';
        } catch (e) { modeDesc.textContent = 'Gagal memuat mode: ' + e.message; }
      }
      modeSel.addEventListener('change', () => { modeDesc.textContent = MODE_DESC[modeSel.value] || ''; });
      modeSave.addEventListener('click', () => {
        TO.busy(modeSave, 'Menyimpan…', async () => {
          await TO.api('/api/admin/settings/payment-mode', { method: 'POST', body: { mode: modeSel.value } });
          TO.toast('Mode pembayaran → ' + modeSel.value, 'success');
        }).catch((e) => TO.toast(e.message, 'error'));
      });
      loadMode();

      // ----- Gateway aktif (Pakasir / Duitku) + status konfigurasi -----
      const gwSel = document.getElementById('active-gw');
      const gwDesc = document.getElementById('gw-desc');
      const gwSave = document.getElementById('gw-save');
      function gwStatusText(d) {
        if (!d.duitku_configured) return 'Duitku belum dikonfigurasi (DUITKU_MERCHANT_CODE / DUITKU_API_KEY belum di-set).';
        if (d.duitku_sandbox) return 'Duitku: MODE SANDBOX — tidak dipakai untuk user di ditryout.in (hanya uji di localhost/preview). Set DUITKU_SANDBOX=false saat go-live.';
        return 'Duitku: siap produksi.';
      }
      async function loadGateway() {
        try {
          const d = await TO.api('/api/admin/settings/active-gateway');
          gwSel.value = d.gateway;
          gwSel.options[1].disabled = !d.duitku_configured; // opsi Duitku
          gwDesc.textContent = 'Pakasir: ' + (d.pakasir_configured ? 'terkonfigurasi.' : 'BELUM dikonfigurasi.') + ' ' + gwStatusText(d);
        } catch (e) { gwDesc.textContent = 'Gagal memuat gateway: ' + e.message; }
      }
      gwSave.addEventListener('click', () => {
        TO.busy(gwSave, 'Menyimpan…', async () => {
          await TO.api('/api/admin/settings/active-gateway', { method: 'POST', body: { gateway: gwSel.value } });
          TO.toast('Gateway aktif → ' + gwSel.value, 'success');
        }).catch((e) => TO.toast(e.message, 'error'));
      });
      loadGateway();

      const listEl = document.getElementById('list');
      const pagerEl = document.getElementById('pager');
      const revEl = document.getElementById('revenue');
      const fromEl = document.getElementById('f-from');
      const toEl = document.getElementById('f-to');
      let page = 1;

      // Tanggal kalender WIB (UTC+7) — sama dengan yang dipakai server sebagai
      // batas "hari", apa pun zona waktu perangkat admin.
      function wibDateStr(offsetDays = 0) {
        return new Date(Date.now() + 7 * 3600 * 1000 + offsetDays * 86_400_000)
          .toISOString().slice(0, 10);
      }

      function statusBadge(s) {
        if (s === 'paid') return '<span class="badge badge-success">PAID</span>';
        if (s === 'pending') return '<span class="badge badge-warn">PENDING</span>';
        if (s === 'expired') return '<span class="badge">EXPIRED</span>';
        return '<span class="badge badge-danger">FAILED</span>';
      }

      async function load() {
        listEl.innerHTML = '<p class="muted">Memuat…</p>';
        const params = new URLSearchParams();
        const st = document.getElementById('f-status').value;
        if (st) params.set('status', st);
        if (fromEl.value && toEl.value) {
          params.set('from', fromEl.value);
          params.set('to', toEl.value);
        }
        params.set('page', page);
        try {
          const d = await TO.api('/api/admin/payments?' + params.toString());
          const label = (fromEl.value && toEl.value)
            ? ` (${fromEl.value} s.d. ${toEl.value})` : ' (semua waktu)';
          revEl.innerHTML = `Pendapatan${label}: <strong>${TO.rupiah(d.revenue)}</strong>` +
            ' <span class="small">— transaksi lunas menurut tanggal dibayar</span>';
          if (!d.payments.length) { listEl.innerHTML = '<p class="muted">Tidak ada transaksi.</p>'; }
          else {
            listEl.innerHTML = `
              <div class="table-wrap"><table class="table">
                <thead><tr><th>Ref</th><th>Pengguna</th><th>Produk</th><th class="num">Nominal</th><th>Metode</th><th>Status</th><th>Dibayar</th><th>Aksi</th></tr></thead>
                <tbody>${d.payments.map((p) => `
                  <tr>
                    <td class="mono small">${TO.esc(p.reference)}</td>
                    <td>${TO.esc(p.user_name)}<div class="small muted">${TO.esc(p.user_email)}</div></td>
                    <td>${TO.esc(p.product_name)}</td>
                    <td class="num">${TO.rupiah(p.amount)}</td>
                    <td class="small">${p.method === 'manual' ? 'QRIS manual' : p.gateway === 'duitku' ? 'QRIS · Duitku' : p.gateway === 'pakasir' ? 'QRIS · Pakasir' : TO.esc(p.method || '-')}</td>
                    <td>${statusBadge(p.status)}</td>
                    <td class="small">${p.paid_at ? TO.fmtDateTime(p.paid_at) : '<span class="muted">—</span>'}</td>
                    <td>${p.status === 'pending'
                      ? `<button class="btn btn-sm mark-paid" data-id="${p.id}" data-ref="${TO.esc(p.reference)}" data-name="${TO.esc(p.user_name)}" data-amount="${p.amount}">Tandai Lunas</button>`
                      : '<span class="muted">—</span>'}</td>
                  </tr>`).join('')}
                </tbody>
              </table></div>`;
            listEl.querySelectorAll('.mark-paid').forEach((btn) => {
              btn.addEventListener('click', () => {
                const { id, ref, name, amount } = btn.dataset;
                if (!confirm(
                  `Tandai transaksi ${ref} (${name}, ${TO.rupiah(Number(amount))}) sebagai LUNAS?\n\n` +
                  'Pastikan uang BENAR-BENAR sudah masuk (cek mutasi QRIS / e-wallet Anda) — ' +
                  'aksi ini langsung memperpanjang masa akses pengguna dan tidak bisa dibatalkan.'
                )) return;
                TO.busy(btn, 'Menandai…', async () => {
                  await TO.api(`/api/admin/payments/${id}/mark-paid`, { method: 'POST', body: {} });
                  TO.toast('Transaksi ditandai lunas — akses pengguna aktif', 'success');
                  load();
                }).catch((e) => TO.toast(e.message, 'error'));
              });
            });
          }
          pagerEl.innerHTML = ADM.pagerHtml(d.total, d.page, d.per_page);
          ADM.bindPager(pagerEl, (p) => { page = p; load(); });
        } catch (e) { listEl.innerHTML = '<div class="alert alert-danger">' + TO.esc(e.message) + '</div>'; }
      }

      document.getElementById('filter-btn').addEventListener('click', () => { page = 1; load(); });
      document.getElementById('p-today').addEventListener('click', () => {
        fromEl.value = toEl.value = wibDateStr(); page = 1; load();
      });
      document.getElementById('p-yesterday').addEventListener('click', () => {
        fromEl.value = toEl.value = wibDateStr(-1); page = 1; load();
      });
      document.getElementById('p-all').addEventListener('click', () => {
        fromEl.value = toEl.value = ''; page = 1; load();
      });
      load();
    })();
  </script>
</body>
</html>
