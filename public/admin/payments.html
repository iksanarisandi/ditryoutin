<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaksi — Tryout UPKP</title>
  <link rel="icon" type="image/png" sizes="48x48" href="/img/favicon-48.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <div class="admin-layout">
    <aside id="admin-side"></aside>
    <main class="admin-main">
      <div class="admin-head"><h1>Transaksi Pembayaran</h1></div>
      <div class="filter-bar">
        <select id="f-status">
          <option value="">Semua Status</option>
          <option value="pending">Pending</option>
          <option value="paid">Paid</option>
          <option value="failed">Failed</option>
          <option value="expired">Expired</option>
        </select>
        <button class="btn" id="filter-btn">Filter</button>
      </div>
      <div class="card">
        <div id="list"><p class="muted">Memuat…</p></div>
        <div class="pager" id="pager"></div>
      </div>
    </main>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    (async function () {
      const me = await ADM.adminInit('/admin/payments.html');
      if (!me) return;

      const listEl = document.getElementById('list');
      const pagerEl = document.getElementById('pager');
      let page = 1;

      function statusBadge(s) {
        if (s === 'paid') return '<span class="badge badge-success">PAID</span>';
        if (s === 'pending') return '<span class="badge badge-warn">PENDING</span>';
        if (s === 'expired') return '<span class="badge">EXPIRED</span>';
        return '<span class="badge badge-danger">FAILED</span>';
      }

      async function load() {
        listEl.innerHTML = '<p class="muted">Memuat…</p>';
        const params = new URLSearchParams();
        const st = document.getElementById('f-status').value;
        if (st) params.set('status', st);
        params.set('page', page);
        try {
          const d = await TO.api('/api/admin/payments?' + params.toString());
          if (!d.payments.length) { listEl.innerHTML = '<p class="muted">Tidak ada transaksi.</p>'; }
          else {
            listEl.innerHTML = `
              <div class="table-wrap"><table class="table">
                <thead><tr><th>Ref</th><th>Pengguna</th><th>Produk</th><th class="num">Nominal</th><th>Metode</th><th>Status</th><th>Dibayar</th><th>Aksi</th></tr></thead>
                <tbody>${d.payments.map((p) => `
                  <tr>
                    <td class="mono small">${TO.esc(p.reference)}</td>
                    <td>${TO.esc(p.user_name)}<div class="small muted">${TO.esc(p.user_email)}</div></td>
                    <td>${TO.esc(p.product_name)}</td>
                    <td class="num">${TO.rupiah(p.amount)}</td>
                    <td class="small">${p.method === 'manual' ? 'QRIS manual' : TO.esc(p.method || '-')}</td>
                    <td>${statusBadge(p.status)}</td>
                    <td class="small">${p.paid_at ? TO.fmtDateTime(p.paid_at) : '<span class="muted">—</span>'}</td>
                    <td>${p.status === 'pending'
                      ? `<button class="btn btn-sm mark-paid" data-id="${p.id}" data-ref="${TO.esc(p.reference)}" data-name="${TO.esc(p.user_name)}" data-amount="${p.amount}">Tandai Lunas</button>`
                      : '<span class="muted">—</span>'}</td>
                  </tr>`).join('')}
                </tbody>
              </table></div>`;
            listEl.querySelectorAll('.mark-paid').forEach((btn) => {
              btn.addEventListener('click', async () => {
                const { id, ref, name, amount } = btn.dataset;
                if (!confirm(
                  `Tandai transaksi ${ref} (${name}, ${TO.rupiah(Number(amount))}) sebagai LUNAS?\n\n` +
                  'Pastikan uang BENAR-BENAR sudah masuk (cek mutasi QRIS / e-wallet Anda) — ' +
                  'aksi ini langsung memperpanjang masa akses pengguna dan tidak bisa dibatalkan.'
                )) return;
                btn.disabled = true;
                btn.textContent = 'Menandai…';
                try {
                  await TO.api(`/api/admin/payments/${id}/mark-paid`, { method: 'POST', body: {} });
                  TO.toast('Transaksi ditandai lunas — akses pengguna aktif', 'success');
                  load();
                } catch (e) {
                  TO.toast(e.message, 'error');
                  btn.disabled = false;
                  btn.textContent = 'Tandai Lunas';
                }
              });
            });
          }
          pagerEl.innerHTML = ADM.pagerHtml(d.total, d.page, d.per_page);
          ADM.bindPager(pagerEl, (p) => { page = p; load(); });
        } catch (e) { listEl.innerHTML = '<div class="alert alert-danger">' + TO.esc(e.message) + '</div>'; }
      }

      document.getElementById('filter-btn').addEventListener('click', () => { page = 1; load(); });
      load();
    })();
  </script>
</body>
</html>
