<!DOCTYPE html>
<html lang="id">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VZMGZFN4KX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-VZMGZFN4KX');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar — Tryout UPKP</title>
  <link rel="icon" type="image/png" sizes="48x48" href="/img/favicon-48.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <div class="auth-wrap">
    <div class="container-sm">
      <div class="card auth-card">
        <img class="auth-logo" src="/img/logo-192.png" alt="Tryout UPKP" width="64" height="64">
        <h1>Daftar Akun</h1>
        <p class="muted">Langsung bisa masuk setelah mendaftar.</p>
        <div id="error-box" hidden><div class="alert alert-danger" id="error-msg"></div></div>
        <form id="reg-form">
          <div class="form-group">
            <label for="name">Nama Lengkap</label>
            <input type="text" id="name" required maxlength="100" placeholder="Nama Anda">
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="nama@email.com" autocomplete="email" aria-describedby="email-help">
            <p class="muted small" id="email-help" style="margin:6px 0 0">Gunakan email aktif yang bisa Anda buka. Bukti pembayaran dan tautan reset password dikirim ke email ini.</p>
            <div class="alert alert-warn small" id="email-suggest" role="status" hidden style="margin:8px 0 0"></div>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="pw-field">
              <input type="password" id="password" required minlength="8" maxlength="100" placeholder="Minimal 8 karakter">
            </div>
          </div>
          <div class="form-group">
            <label for="ref">Kode Undangan <span class="muted small">(opsional)</span></label>
            <input type="text" id="ref" maxlength="16" autocomplete="off" placeholder="Punya kode undangan teman?">
          </div>
          <div class="form-group" id="cf-turnstile" hidden></div>
          <button class="btn btn-block" type="submit" id="btn-submit">Daftar</button>
        </form>
        <p class="mt small muted">Dengan mendaftar, Anda menyetujui <a href="/privacy">Kebijakan Privasi</a> kami.</p>
        <p class="small muted">Sudah punya akun? <a href="/login.html">Masuk</a></p>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    (async function () {
      TO.renderHeader('/register.html', await TO.fetchMe());
      const form = document.getElementById('reg-form');
      const btn = document.getElementById('btn-submit');
      const errBox = document.getElementById('error-box');
      const errMsg = document.getElementById('error-msg');

      // Referal: prefill kode dari ?ref= (link undangan) + banner. Normalisasi
      // sama seperti server: uppercase, tanpa non-alphanumerik, maks 16 char.
      const refParam = (TO.qs('ref') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 16);
      if (refParam) {
        form.ref.value = refParam;
        errBox.insertAdjacentHTML('beforebegin',
          '<div class="alert alert-success">Kamu diundang — dapat <strong>diskon 10%</strong> ' +
          'untuk pembelian akses pertamamu.</div>');
      }

      // Turnstile (aktif hanya jika server mengonfigurasi kuncinya).
      let turnstileToken = '';
      let tsWidget = null;
      try {
        const cfg = await TO.api('/api/auth/captcha');
        if (cfg.enabled) {
          await new Promise((res, rej) => {
            if (window.turnstile) return res();
            const s = document.createElement('script');
            s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
            s.onload = res; s.onerror = rej;
            document.head.appendChild(s);
          });
          tsWidget = window.turnstile.render('#cf-turnstile', {
            sitekey: cfg.site_key,
            callback: (t) => { turnstileToken = t; },
            'expired-callback': () => { turnstileToken = ''; },
          });
          document.getElementById('cf-turnstile').hidden = false;
        }
      } catch (e) { /* captcha opsional — biarkan form tetap jalan */ }

      // Saran salah ketik domain email populer. Email salah = bukti bayar &
      // reset password tidak pernah sampai, dan email yang memantul merusak
      // reputasi pengirim di Resend. Hanya saran: user tetap boleh lanjut.
      const DOMAIN_FIX = {
        'gmial.com': 'gmail.com', 'gmai.com': 'gmail.com', 'gmal.com': 'gmail.com',
        'gamil.com': 'gmail.com', 'gnail.com': 'gmail.com', 'gmaill.com': 'gmail.com',
        'gmeil.com': 'gmail.com', 'gmail.co': 'gmail.com', 'gmail.cm': 'gmail.com',
        'gmail.om': 'gmail.com', 'gmail.coom': 'gmail.com', 'gmail.co.id': 'gmail.com',
        'gmail.id': 'gmail.com', 'gmali.com': 'gmail.com', 'gimail.com': 'gmail.com',
        'yaho.com': 'yahoo.com', 'yhoo.com': 'yahoo.com', 'yahooo.com': 'yahoo.com',
        'yahoo.co': 'yahoo.com', 'yaho.co.id': 'yahoo.co.id', 'yahoo.co.i': 'yahoo.co.id',
        'hotmial.com': 'hotmail.com', 'hotmai.com': 'hotmail.com', 'hotmail.co': 'hotmail.com',
        'outlok.com': 'outlook.com', 'outlook.co': 'outlook.com', 'iclod.com': 'icloud.com',
        'icloud.co': 'icloud.com',
      };
      function suggestEmail(raw) {
        const v = String(raw || '').trim().toLowerCase();
        const at = v.lastIndexOf('@');
        if (at < 1) return '';
        const domain = v.slice(at + 1);
        let fixed = DOMAIN_FIX[domain] || '';
        // Akhiran .com yang salah ketik (.con, .cpm, .comm, .vom, .xom) di domain apa pun.
        if (!fixed && /\.(con|cpm|comm|vom|xom|cim)$/.test(domain)) fixed = domain.replace(/\.[a-z]+$/, '.com');
        return fixed && fixed !== domain ? v.slice(0, at + 1) + fixed : '';
      }
      const suggestBox = document.getElementById('email-suggest');
      let warnedFor = '';
      function showSuggestion() {
        const s = suggestEmail(form.email.value);
        if (!s) { suggestBox.hidden = true; return ''; }
        // Render ulang hanya bila saran berubah: blur saat mengklik tautan
        // saran tidak boleh mengganti elemennya di tengah klik.
        if (suggestBox.hidden || suggestBox.dataset.s !== s) {
          suggestBox.dataset.s = s;
          suggestBox.innerHTML = 'Maksud Anda <a href="#" data-fix><strong>' + TO.esc(s) + '</strong></a>? Periksa lagi agar email kami sampai.';
          suggestBox.hidden = false;
        }
        return s;
      }
      suggestBox.addEventListener('click', (ev) => {
        if (!ev.target.closest('[data-fix]')) return;
        ev.preventDefault();
        form.email.value = suggestBox.dataset.s || form.email.value;
        suggestBox.hidden = true;
        form.email.focus();
      });
      form.email.addEventListener('blur', showSuggestion);
      form.email.addEventListener('input', () => { if (!suggestBox.hidden) showSuggestion(); });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        // Ada saran salah ketik yang belum dilihat: tahan sekali saja; kirim
        // ulang tanpa mengubah email = user yakin emailnya benar.
        const email = form.email.value.trim().toLowerCase();
        if (showSuggestion() && warnedFor !== email) {
          warnedFor = email;
          form.email.focus();
          return;
        }
        errBox.hidden = true;
        btn.disabled = true;
        btn.textContent = 'Memproses…';
        try {
          await TO.api('/api/auth/register', {
            method: 'POST',
            body: { name: form.name.value, email: form.email.value, password: form.password.value, ref: form.ref.value.trim() || undefined, turnstile_token: turnstileToken || undefined },
          });
          // beacon agar hit tetap terkirim meski halaman langsung pindah.
          gtag('event', 'sign_up', { method: 'email', transport_type: 'beacon' });
          location.href = '/dashboard.html';
        } catch (err) {
          errMsg.textContent = err.message;
          errBox.hidden = false;
          btn.disabled = false;
          btn.textContent = 'Daftar';
          // Token tunggal-pakai: minta token baru untuk percobaan berikutnya.
          turnstileToken = '';
          if (tsWidget !== null) window.turnstile.reset(tsWidget);
        }
      });
    })();
  </script>
</body>
</html>
