<!DOCTYPE html>
<html lang="id">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VZMGZFN4KX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-VZMGZFN4KX');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar — Tryout UPKP</title>
  <link rel="icon" type="image/png" sizes="48x48" href="/img/favicon-48.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <div class="auth-wrap">
    <div class="container-sm">
      <div class="card auth-card">
        <img class="auth-logo" src="/img/logo-192.png" alt="Tryout UPKP" width="64" height="64">
        <h1>Daftar Akun</h1>
        <p class="muted">Tanpa verifikasi email — langsung bisa masuk.</p>
        <div id="error-box" hidden><div class="alert alert-danger" id="error-msg"></div></div>
        <form id="reg-form">
          <div class="form-group">
            <label for="name">Nama Lengkap</label>
            <input type="text" id="name" required maxlength="100" placeholder="Nama Anda">
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="nama@email.com">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required minlength="8" maxlength="100" placeholder="Minimal 8 karakter">
          </div>
          <div class="form-group" id="cf-turnstile" hidden></div>
          <button class="btn btn-block" type="submit" id="btn-submit">Daftar</button>
        </form>
        <p class="mt small muted">Sudah punya akun? <a href="/login.html">Masuk</a></p>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    (async function () {
      TO.renderHeader('/register.html', await TO.fetchMe());
      const form = document.getElementById('reg-form');
      const btn = document.getElementById('btn-submit');
      const errBox = document.getElementById('error-box');
      const errMsg = document.getElementById('error-msg');

      // Turnstile (aktif hanya jika server mengonfigurasi kuncinya).
      let turnstileToken = '';
      let tsWidget = null;
      try {
        const cfg = await TO.api('/api/auth/captcha');
        if (cfg.enabled) {
          await new Promise((res, rej) => {
            if (window.turnstile) return res();
            const s = document.createElement('script');
            s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
            s.onload = res; s.onerror = rej;
            document.head.appendChild(s);
          });
          tsWidget = window.turnstile.render('#cf-turnstile', {
            sitekey: cfg.site_key,
            callback: (t) => { turnstileToken = t; },
            'expired-callback': () => { turnstileToken = ''; },
          });
          document.getElementById('cf-turnstile').hidden = false;
        }
      } catch (e) { /* captcha opsional — biarkan form tetap jalan */ }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errBox.hidden = true;
        btn.disabled = true;
        btn.textContent = 'Memproses…';
        try {
          await TO.api('/api/auth/register', {
            method: 'POST',
            body: { name: form.name.value, email: form.email.value, password: form.password.value, turnstile_token: turnstileToken || undefined },
          });
          // beacon agar hit tetap terkirim meski halaman langsung pindah.
          gtag('event', 'sign_up', { method: 'email', transport_type: 'beacon' });
          location.href = '/dashboard.html';
        } catch (err) {
          errMsg.textContent = err.message;
          errBox.hidden = false;
          btn.disabled = false;
          btn.textContent = 'Daftar';
          // Token tunggal-pakai: minta token baru untuk percobaan berikutnya.
          turnstileToken = '';
          if (tsWidget !== null) window.turnstile.reset(tsWidget);
        }
      });
    })();
  </script>
</body>
</html>
