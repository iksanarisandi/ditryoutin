<!DOCTYPE html>
<html lang="id">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VZMGZFN4KX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-VZMGZFN4KX');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — Tryout UPKP</title>
  <link rel="icon" type="image/png" sizes="48x48" href="/img/favicon-48.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <div class="auth-wrap">
    <div class="container-sm">
      <div class="card auth-card">
        <img class="auth-logo" src="/img/logo-192.png" alt="Tryout UPKP" width="64" height="64">
        <h1>Masuk</h1>
        <p class="muted">Masuk ke akun Tryout UPKP Anda.</p>
        <div id="error-box" hidden><div class="alert alert-danger" id="error-msg"></div></div>
        <div id="google-auth" hidden></div>
        <form id="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email" placeholder="nama@email.com">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="pw-field">
              <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Minimal 8 karakter">
            </div>
          </div>
          <div class="form-group" id="cf-turnstile" hidden></div>
          <button class="btn btn-block" type="submit" id="btn-submit">Masuk</button>
        </form>
        <p class="mt small"><a href="/forgot.html">Lupa password?</a></p>
        <p class="small muted">Belum punya akun? <a href="/register.html">Daftar sekarang</a></p>
        <p class="small muted"><a href="/privacy">Kebijakan Privasi</a></p>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    (async function () {
      TO.renderHeader('/login.html', await TO.fetchMe());
      const form = document.getElementById('login-form');
      const btn = document.getElementById('btn-submit');
      const errBox = document.getElementById('error-box');
      const errMsg = document.getElementById('error-msg');
      const gErr = TO.googleErrorMessage();
      if (gErr) { errMsg.textContent = gErr; errBox.hidden = false; }

      // Turnstile (aktif hanya jika server mengonfigurasi kuncinya).
      let turnstileToken = '';
      let tsWidget = null;
      let googleOn = false;
      try {
        const cfg = await TO.api('/api/auth/captcha');
        if (cfg.google) {
          googleOn = true;
          TO.renderGoogleAuth(document.getElementById('google-auth'), { from: 'login', label: 'Masuk dengan Google' });
        }
        if (cfg.enabled) {
          await new Promise((res, rej) => {
            if (window.turnstile) return res();
            const s = document.createElement('script');
            s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
            s.onload = res; s.onerror = rej;
            document.head.appendChild(s);
          });
          tsWidget = window.turnstile.render('#cf-turnstile', {
            sitekey: cfg.site_key,
            callback: (t) => { turnstileToken = t; },
            'expired-callback': () => { turnstileToken = ''; },
          });
          document.getElementById('cf-turnstile').hidden = false;
        }
      } catch (e) { /* captcha opsional — biarkan form tetap jalan */ }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errBox.hidden = true;
        btn.disabled = true;
        btn.textContent = 'Memproses…';
        try {
          const data = await TO.api('/api/auth/login', {
            method: 'POST',
            body: { email: form.email.value, password: form.password.value, turnstile_token: turnstileToken || undefined },
          });
          gtag('event', 'login', { method: 'email', role: data.user.role, transport_type: 'beacon' });
          const next = TO.qs('next');
          const dest = next && next.startsWith('/') ? next : (data.user.role === 'admin' ? '/admin/' : '/dashboard.html');
          location.href = dest;
        } catch (err) {
          // Akun yang dibuat lewat Google tidak punya password.
          errMsg.textContent = err.message + (googleOn && err.status === 401
            ? ' Jika Anda biasa masuk dengan Google, gunakan tombol "Masuk dengan Google" di atas.'
            : '');
          errBox.hidden = false;
          btn.disabled = false;
          btn.textContent = 'Masuk';
          // Token tunggal-pakai: minta token baru untuk percobaan berikutnya.
          turnstileToken = '';
          if (tsWidget !== null) window.turnstile.reset(tsWidget);
        }
      });
    })();
  </script>
</body>
</html>
