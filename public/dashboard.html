<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Tryout UPKP</title>
  <link rel="icon" type="image/png" sizes="48x48" href="/img/favicon-48.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <div class="container mt mb">
    <div id="active-attempt" class="mb" hidden>
      <div class="alert alert-warn" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <div style="flex:1">Anda memiliki ujian yang sedang berjalan: <strong id="aa-title"></strong></div>
        <a class="btn btn-sm" id="aa-continue" href="#">Lanjutkan Ujian</a>
      </div>
    </div>

    <div class="card mb" id="access-card">
      <div class="access-box">
        <div class="info">
          <h2 id="access-title">Akses Tryout</h2>
          <div id="access-status"></div>
          <div class="access-meta" id="access-meta"></div>
        </div>
        <a class="btn" href="/payment.html" id="buy-btn">Beli / Perpanjang Akses</a>
      </div>
    </div>

    <div id="buy-section" class="mb" hidden>
      <div class="alert alert-warn">Akses Anda telah berakhir atau belum aktif. Silakan pilih paket akses.</div>
      <div class="grid grid-2" id="buy-products"></div>
    </div>

    <h2 class="mt">Tryout UPKP</h2>
    <div id="packages-wrap" class="grid grid-3">
      <div class="card muted">Memuat paket…</div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    (async function () {
      const me = await TO.requireUser();
      if (!me) return;
      TO.renderHeader('/dashboard.html', me);

      const a = me.access;
      const statusEl = document.getElementById('access-status');
      const metaEl = document.getElementById('access-meta');
      if (a.active) {
        statusEl.innerHTML = '<span class="badge badge-success">AKTIF</span>';
        metaEl.innerHTML = `
          <div><span class="k">Mulai</span><span class="v">${TO.fmtDate(a.started_at)} WITA</span></div>
          <div><span class="k">Berakhir</span><span class="v">${TO.fmtDate(a.expires_at)} WITA</span></div>
          <div><span class="k">Sisa</span><span class="v">${a.days_left} hari</span></div>`;
      } else {
        statusEl.innerHTML = '<span class="badge badge-danger">TIDAK AKTIF</span>';
        metaEl.innerHTML = a.expires_at
          ? `<div><span class="k">Berakhir</span><span class="v">${TO.fmtDate(a.expires_at)} WITA</span></div>`
          : '<div><span class="k">Status</span><span class="v">Belum pernah berlangganan</span></div>';
        document.getElementById('buy-section').hidden = false;
      }

      // Banner ujian berjalan
      try {
        const { attempt } = await TO.api('/api/attempts/active');
        if (attempt) {
          document.getElementById('aa-title').textContent = attempt.title;
          document.getElementById('aa-continue').href = '/exam.html?id=' + attempt.id;
          document.getElementById('active-attempt').hidden = false;
        }
      } catch (e) { /* abaikan */ }

      // Produk bila belum aktif
      if (!a.active && me.user.role !== 'admin') {
        try {
          const { products } = await TO.api('/api/products');
          document.getElementById('buy-products').innerHTML = products.map((p) => `
            <div class="card price-card">
              <h3>${TO.esc(p.name)}</h3>
              <div class="price" style="font-size:1.4rem;font-weight:800;color:var(--primary-dark)">${TO.rupiah(p.price)}</div>
              <p class="muted small">Akses ${p.duration_days} hari ke seluruh paket</p>
              <a class="btn" href="/payment.html?product=${p.id}">Beli</a>
            </div>`).join('');
        } catch (e) { /* abaikan */ }
      }

      // Paket tryout
      const wrap = document.getElementById('packages-wrap');
      try {
        const { packages } = await TO.api('/api/packages');
        if (!packages.length) {
          wrap.innerHTML = '<div class="card muted">Belum ada paket tryout tersedia. Cek kembali nanti.</div>';
        } else {
          wrap.innerHTML = packages.map((p) => `
            <div class="card pkg-card">
              <div class="top">
                <h3>${TO.esc(p.title)}</h3>
                <span class="badge badge-primary">${TO.esc(p.exam_type)}</span>
              </div>
              <div class="meta">
                ${p.question_count} soal &bull; ${p.duration_minutes} menit<br>
                Kategori: ${TO.esc(p.categories)}
              </div>
              <div class="foot">
                <span class="last muted">${p.attempt_count > 0
                  ? 'Percobaan terakhir: <strong>' + (p.last_score ?? 0) + '</strong> / ' + (p.question_count * 5) + ' poin (' + p.attempt_count + 'x)'
                  : 'Belum pernah mengerjakan'}</span>
                <button class="btn btn-sm start-btn" data-id="${p.id}" data-title="${TO.esc(p.title)}">Mulai</button>
              </div>
            </div>`).join('');
          wrap.querySelectorAll('.start-btn').forEach((btn) => {
            btn.addEventListener('click', async () => {
              btn.disabled = true;
              try {
                const data = await TO.api('/api/attempts', { method: 'POST', body: { package_id: Number(btn.dataset.id) } });
                location.href = '/exam.html?id=' + data.attempt_id;
              } catch (err) {
                if (err.status === 409 && err.data && err.data.attempt_id) {
                  location.href = '/exam.html?id=' + err.data.attempt_id;
                  return;
                }
                TO.toast(err.message, 'error');
                btn.disabled = false;
              }
            });
          });
        }
      } catch (err) {
        wrap.innerHTML = '<div class="card"><div class="alert alert-danger">' + TO.esc(err.message) + '</div></div>';
      }
    })();
  </script>
</body>
</html>
