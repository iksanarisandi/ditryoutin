<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup Admin — Tryout UPKP</title>
  <link rel="icon" type="image/png" sizes="48x48" href="/img/favicon-48.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <div class="auth-wrap">
    <div class="container-sm">
      <div class="card auth-card">
        <h1>Setup Admin</h1>
        <p class="muted">Halaman ini hanya tersedia sekali, selama belum ada akun admin.</p>
        <div id="error-box" hidden><div class="alert alert-danger" id="error-msg"></div></div>
        <form id="setup-form">
          <div class="form-group" id="secret-group">
            <label for="secret">Secret Setup <span class="muted">(opsional)</span></label>
            <input type="password" id="secret" autocomplete="off">
            <div class="field-hint">Diisi hanya jika admin server mengaturnya — kosongkan jika tidak yakin.</div>
          </div>
          <div class="form-group">
            <label for="name">Nama</label>
            <input type="text" id="name" value="Admin" maxlength="100">
          </div>
          <div class="form-group">
            <label for="email">Email Admin</label>
            <input type="email" id="email" required placeholder="admin@email.com">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required minlength="8" maxlength="100">
          </div>
          <button class="btn btn-block" type="submit" id="btn-submit">Buat Akun Admin</button>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    (async function () {
      TO.renderHeader('/setup.html', null);
      let info;
      try { info = await TO.api('/api/setup'); }
      catch (e) { info = null; }
      if (!info || !info.needed) {
        document.querySelector('.card').innerHTML = '<h1>Setup selesai</h1><p class="muted">Admin sudah dibuat. Halaman ini tidak tersedia lagi.</p><a class="btn" href="/login.html">Ke halaman masuk</a>';
        return;
      }

      const form = document.getElementById('setup-form');
      const btn = document.getElementById('btn-submit');
      const errBox = document.getElementById('error-box');
      const errMsg = document.getElementById('error-msg');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errBox.hidden = true;
        btn.disabled = true;
        btn.textContent = 'Membuat…';
        try {
          await TO.api('/api/setup', {
            method: 'POST',
            body: {
              secret: document.getElementById('secret').value || undefined,
              name: form.name.value,
              email: form.email.value,
              password: form.password.value,
            },
          });
          location.href = '/admin/';
        } catch (err) {
          errMsg.textContent = err.message;
          errBox.hidden = false;
          btn.disabled = false;
          btn.textContent = 'Buat Akun Admin';
        }
      });
    })();
  </script>
</body>
</html>
